<!doctype html>
<!--
  Values below marked %SEO_*% are injected at build time from
  src/content/seo.md by the contentHtml plugin in vite.config.ts.
  Edit the content file, not this one.
-->
<html lang="%SEO_LANG%">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="%SEO_IMAGE%" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="%SEO_THEME_COLOR%" />
    <title>%SEO_TITLE%</title>
    <meta name="description" content="%SEO_DESCRIPTION%" />
    <meta name="keywords" content="%SEO_KEYWORDS%" />
    <meta property="og:title" content="%SEO_OG_TITLE%" />
    <meta property="og:description" content="%SEO_OG_DESCRIPTION%" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%SEO_IMAGE%" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="%SEO_TWITTER_TITLE%" />
    <meta name="twitter:description" content="%SEO_TWITTER_DESCRIPTION%" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
