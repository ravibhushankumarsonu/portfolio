# Netlify build configuration.
#
# This file takes precedence over the settings in the Netlify UI, which still
# held Next.js values from before the project migrated to Vite (`yarn build`
# publishing `.next`). Keeping the config here means the deploy setup is
# reviewable and moves with the branch.

[build]
  command = "npm run build"
  # Vite's default output directory. The old value was `.next`, which no
  # longer exists — that's the "Deploy directory does not exist" failure.
  publish = "dist"

[build.environment]
  # Vite 7 requires ^20.19.0 || >=22.12.0. Pinning avoids inheriting whatever
  # default Netlify happens to use.
  NODE_VERSION = "22"

# The app routes on window.location.pathname (/about, /projects, /contact),
# so the server must return index.html for any path and let the client render
# it. Without this, a hard refresh or direct link to /about returns 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite fingerprints filenames in /assets, so those are safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
